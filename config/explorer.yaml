# The node is deliberately independent of FAST-LIVO2 source code. Only these
# standard ROS1 topics form the runtime contract.
topics:
  odom: /daib_slam/odom
  cloud: /daib_slam/planning_cloud
  degenerate: /daib_slam/degenerate
  degeneracy_score: /daib_slam/degeneracy_score
  lio_runtime_ms: /daib_slam/lio_runtime_ms
  pvbsm_delta: /daib_slam/pvbsm_delta
  goal: /daib_explorer/goal
  frontiers: /daib_explorer/frontiers
  valid_cluster_frontiers: /daib_explorer/valid_cluster_frontiers
  selected_cluster_frontiers: /daib_explorer/selected_cluster_frontiers
  planning_cloud: /daib_explorer/planning_cloud
  ready: /daib_explorer/ready
  state: /daib_explorer/state
  generation: /daib_explorer/generation
  pvbsm_memory_stats: /daib_explorer/pvbsm_memory_stats

robot_id: 0

# The latest cloud replaces any pending cloud. Mapping runs at this independent
# timer and the queue-of-one handoff never build a backlog inside FAST-LIVO2.
# Use 10 Hz for behavior parity; reduce to 5 Hz only after board profiling.
map_update_rate_hz: 10.0
input_timeout_s: 1.0
ready_heartbeat_rate_hz: 1.0
max_input_stamp_skew_s: 0.2
max_cloud_points_to_convert: 6000
max_published_frontiers: 2000
planning_output_radius_m: 12.0
max_published_planning_points: 6000

# Low-rate DAIB-PVBSM long-term memory. This limit bounds detailed
# plane/residual records; compact observed-root coverage survives demotion.
# The callback is independent of the 10 Hz occupancy/frontier loop.
pvbsm_memory_enabled: true
pvbsm_memory_max_records: 200000
max_pvbsm_records_per_delta: 2048

# PVBSM long-term novelty term used only by 1 Hz frontier goal scoring.
# root_voxel_size must match FAST-LIVO2 lio/voxel_size, and submap_edge_roots
# must match FAST-LIVO2 daib_pvbsm/submap_edge_roots.
pvbsm_scoring_enabled: true
pvbsm_root_voxel_size_m: 1.0
pvbsm_submap_edge_roots: 8
# A surface map does not fill all 8^3 spatial roots. Treat 64 observed roots
# as a sufficiently mapped submap for the continuous coverage penalty.
pvbsm_covered_root_target: 64
pvbsm_unseen_submap_bonus: 1.0
pvbsm_submap_coverage_penalty: 2.0
pvbsm_observed_root_penalty: 1.5
pvbsm_degenerate_structure_bonus: 0.75

# High-frequency rolling occupancy map used by frontier selection and the
# EGO-Swarm planning bridge. It is intentionally independent of the SLAM map.
planning_voxel_size_m: 0.5
planning_sensor_range_m: 20.0
planning_map_radius_m: 40.0
planning_prune_budget: 256
max_raycasts_per_update: 64
max_ray_steps: 64
frontier_update_budget: 512
frontier_evaluation_budget: 1200
# Multi-rate scheduling: safety-relevant occupancy and blocked-goal checks run
# on every accepted map update; the following heavier tasks run independently.
frontier_update_rate_hz: 2.0
goal_evaluation_rate_hz: 1.0
long_term_update_rate_hz: 1.0

# Low-frequency trajectory-visit memory used by frontier novelty scoring.
# Structural coverage and submap ownership come only from PVBSM, avoiding a
# second point-cloud-derived long-term map inside Explorer.
coverage_voxel_size_m: 2.0

# Mission-lifetime observation memory. It reuses the already budgeted LiDAR
# rays, deduplicates every cell within a cloud frame, and requires evidence
# from three distinct frames before a 1 m cell becomes stable observed.
# The capability is disabled by default. First validate bounded growth,
# coordinate consistency and overlap with PVBSM in record-only mode; only then
# consider allowing it to suppress goals.
exploration_memory_enabled: false
exploration_memory_filter_enabled: false
exploration_memory_voxel_size_m: 1.0
exploration_memory_min_observations: 3
exploration_memory_max_range_m: 20.0
frontier_history_probe_distance_m: 4.0
frontier_history_probe_step_m: 1.0
frontier_history_observed_ratio: 0.7

replan_interval_s: 1.0
goal_min_hold_time_s: 5.0
# Hold an accepted goal until reached, persistently blocked or stalled.
allow_periodic_goal_switch: false
# Count accepted map updates (10 updates at 10 Hz is about 1.0 s).
goal_blocked_confirm_updates: 10
# Deprecated compatibility switch. Zero disables absolute expiry; do not use
# it together with the progress-based stall policy below.
goal_timeout_s: 0.0
goal_reached_distance_m: 0.5
goal_progress_epsilon_m: 0.25
goal_stall_timeout_s: 15.0
failed_goal_exclusion_radius_m: 1.0
failed_goal_cooldown_s: 30.0
min_goal_distance_m: 2.0
max_goal_distance_m: 15.0
# Symmetric relative-height bound around the current UAV position:
# current_z - 3 m <= goal_z <= current_z + 3 m.
max_goal_vertical_distance_m: 3.0
# Sparse ray maps need not prove that every voxel on the task-level route is
# known free; EGO performs local collision-free trajectory planning.
min_known_free_path_ratio: 0.5
goal_switch_margin: 0.15

# DAIB-MCSVF: form 18-neighbor connected frontier components, reject components
# with fewer than ten planning voxels, then place multiple known-free
# viewpoints for each retained boundary. Frontier validity remains 6-neighbor.
# Prefer viewpoints close to current odom.z and use height changes only when
# no same-height safe candidate exists. Kept for
# compatibility; cluster size is not used by the connected-component logic.
frontier_cluster_size_m: 2.0
min_frontier_cluster_cells: 10
viewpoint_standoff_m: 1.0
viewpoint_search_radius_m: 2.0
viewpoint_same_height_tolerance_m: 0.5
min_wall_clearance_m: 0.5
max_viewpoints_per_cluster: 8
max_safe_viewpoint_candidates: 64
preferred_heading_change_deg: 60.0
max_heading_change_deg: 120.0
distance_cost_weight: 0.5
heading_cost_weight: 3.0
arrival_yaw_cost_weight: 0.5

# Bounded A* is used only to confirm whether the active goal is persistently
# blocked. It is not run for every frontier candidate.
reachability_enabled: true
reachability_max_expansions: 2500
goal_reachability_check_rate_hz: 2.0

# Joint compute budget: reduce exploration work while LIO is busy. This never
# changes FAST-LIVO2 itself; it only consumes its runtime telemetry.
dynamic_budget_enabled: true
# The validated board logs show a 17 ms EMA and roughly 33 ms peaks. The old
# 90/110 ms thresholds made both reduced-budget states unreachable.
lio_busy_threshold_ms: 25.0
lio_overload_threshold_ms: 35.0
lio_time_ema_alpha: 0.20
busy_budget_scale: 0.50
overload_budget_scale: 0.25

# In geometric degeneracy, keep the configured distance envelope by default,
# use stronger switching hysteresis, and prefer rays already known to be free.
degenerate_max_goal_distance_m: 15.0
degenerate_goal_switch_margin: 0.30
degenerate_safe_path_weight: 4.0
