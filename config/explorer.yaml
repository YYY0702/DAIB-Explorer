# The node is deliberately independent of FAST-LIVO2 source code. Only these
# standard ROS1 topics form the runtime contract.
topics:
  odom: /daib_slam/odom
  cloud: /daib_slam/planning_cloud
  degenerate: /daib_slam/degenerate
  degeneracy_score: /daib_slam/degeneracy_score
  lio_runtime_ms: /daib_slam/lio_runtime_ms
  pvbsm_delta: /daib_slam/pvbsm_delta
  goal: /daib_explorer/goal
  frontiers: /daib_explorer/frontiers
  planning_cloud: /daib_explorer/planning_cloud
  ready: /daib_explorer/ready
  state: /daib_explorer/state
  generation: /daib_explorer/generation
  pvbsm_memory_stats: /daib_explorer/pvbsm_memory_stats

robot_id: 0

# The latest cloud replaces any pending cloud. Mapping runs at this independent
# timer and the queue-of-one handoff never build a backlog inside FAST-LIVO2.
# Use 10 Hz for behavior parity; reduce to 5 Hz only after board profiling.
map_update_rate_hz: 10.0
input_timeout_s: 1.0
ready_heartbeat_rate_hz: 1.0
max_input_stamp_skew_s: 0.2
max_cloud_points_to_convert: 6000
max_published_frontiers: 2000
planning_output_radius_m: 12.0
max_published_planning_points: 6000

# Low-rate DAIB-PVBSM long-term geometry cache. This callback is independent
# of the 10 Hz occupancy/frontier loop and never blocks local safety updates.
pvbsm_memory_enabled: true
pvbsm_memory_max_records: 200000
max_pvbsm_records_per_delta: 2048

# PVBSM long-term novelty term used only by 1 Hz frontier goal scoring.
# root_voxel_size must match FAST-LIVO2 lio/voxel_size, and submap_edge_roots
# must match FAST-LIVO2 daib_pvbsm/submap_edge_roots.
pvbsm_scoring_enabled: true
pvbsm_root_voxel_size_m: 1.0
pvbsm_submap_edge_roots: 8
# A surface map does not fill all 8^3 spatial roots. Treat 64 observed roots
# as a sufficiently mapped submap for the continuous coverage penalty.
pvbsm_covered_root_target: 64
pvbsm_unseen_submap_bonus: 1.0
pvbsm_submap_coverage_penalty: 2.0
pvbsm_observed_root_penalty: 1.5
pvbsm_degenerate_structure_bonus: 0.75

# High-frequency rolling occupancy map used by frontier selection and later by
# an EGO-Swarm adapter. It is intentionally independent of the SLAM map.
planning_voxel_size_m: 0.5
planning_sensor_range_m: 20.0
planning_map_radius_m: 40.0
planning_prune_budget: 256
max_raycasts_per_update: 64
max_ray_steps: 64
frontier_update_budget: 512
frontier_evaluation_budget: 1200
# Multi-rate scheduling: safety-relevant occupancy and blocked-goal checks run
# on every accepted map update; the following heavier tasks run independently.
frontier_update_rate_hz: 2.0
goal_evaluation_rate_hz: 1.0
long_term_update_rate_hz: 1.0

# Low-frequency exploration memory. Summaries are internal in the single-UAV
# phase and reserve stable robot/submap IDs for future multi-UAV exchange.
coverage_voxel_size_m: 2.0
max_coverage_points_per_update: 256
submap_translation_threshold_m: 20.0
submap_rotation_threshold_deg: 45.0

replan_interval_s: 1.0
goal_min_hold_time_s: 3.0
# Count accepted map updates (3 updates at 10 Hz is about 0.3 s).
goal_blocked_confirm_updates: 3
same_goal_tolerance_m: 0.5
goal_timeout_s: 12.0
goal_reached_distance_m: 1.0
min_goal_distance_m: 2.0
max_goal_distance_m: 15.0
max_goal_vertical_distance_m: 3.0
goal_switch_margin: 0.15

# Joint compute budget: reduce exploration work while LIO is busy. This never
# changes FAST-LIVO2 itself; it only consumes its runtime telemetry.
dynamic_budget_enabled: true
# The validated board logs show a 17 ms EMA and roughly 33 ms peaks. The old
# 90/110 ms thresholds made both reduced-budget states unreachable.
lio_busy_threshold_ms: 25.0
lio_overload_threshold_ms: 35.0
lio_time_ema_alpha: 0.20
busy_budget_scale: 0.50
overload_budget_scale: 0.25

# In geometric degeneracy, use shorter goals, stronger switching hysteresis,
# and prefer rays already known to be free.
degenerate_max_goal_distance_m: 8.0
degenerate_goal_switch_margin: 0.30
degenerate_safe_path_weight: 4.0
